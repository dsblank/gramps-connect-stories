name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Includes the check that src/generated/ matches the schema.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # optimizeImage() and the player in the runner's preinstalled Google
      # Chrome (the player test fetches basemap tiles from the network).
      - name: Browser tests
        run: npm run test:browser
