name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Includes the check that src/generated/ matches the schema.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Python writer, with Pillow, then its output read by this
      # package (also once as if Pillow weren't installed).
      - name: Python writer
        run: |
          python -m pip install pillow
          PYTHON=python npm run test:python

      # In the runner's preinstalled Google Chrome: optimizeImage(), the
      # player, the embed (cross-origin, as from a CDN) and the viewer site.
      # Builds dist/ and site-dist/ on the way. The map tests fetch
      # basemap tiles from the network.
      - name: Browser tests
        run: npm run test:browser

      # What npm would get: the file list, an install into an empty
      # project, and every entry point bundling and typechecking there.
      - name: Package test
        run: npm run test:pack
