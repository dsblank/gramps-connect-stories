<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gramps Connect Story Viewer</title>
  <meta name="description" content="Open and present a family-history story (.story.zip). Nothing is uploaded: the story stays on your computer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231866ba'/%3E%3Cg transform='translate(9.6 9.6) scale(0.7)'%3E%3Cpath d='M25 32h7M32 15v34M32 15h7M32 49h7' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cg fill='%23fff'%3E%3Crect x='1' y='24' width='24' height='16' rx='4'/%3E%3Crect x='39' y='7' width='24' height='16' rx='4'/%3E%3Crect x='39' y='41' width='24' height='16' rx='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./app.css">
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --text: #1d1f23; --muted: #5f6670; --border: #dde1e6;
      --accent: #2a78d6; --accent-text: #ffffff; --drop: #e8f1fc; --error-bg: #fdecec; --error: #a3221c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --surface: #242424; --text: #e3e3e3; --muted: #a0a4ab; --border: #3a3c40;
        --accent: #3987e5; --accent-text: #ffffff; --drop: #1d2b3d; --error-bg: #3a1d1c; --error: #f3a39f;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #root { height: 100%; }
    .stage { position: fixed; inset: 0; }
    .landing { min-height: 100%; display: flex; justify-content: center; padding: 48px 16px; }
    .landing.dragging { background: var(--drop); }
    .column { width: 100%; max-width: 640px; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; display: flex; align-items: center; gap: 12px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 32px 0 8px; }
    p { margin: 0 0 12px; }
    .lead { color: var(--muted); }
    .drop { margin-top: 24px; border: 2px dashed var(--border); border-radius: 12px; padding: 32px 16px; text-align: center; background: var(--surface); }
    .dragging .drop { border-color: var(--accent); }
    button.primary { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    button.primary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hint { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
    .error { background: var(--error-bg); color: var(--error); border-radius: 8px; padding: 10px 14px; margin-top: 16px; }
    ul { padding-left: 20px; margin: 0; }
    li { margin: 4px 0; }
    a { color: var(--accent); }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; white-space: pre; }
    .small { font-size: 14px; color: var(--muted); }
    /* Wider than the text column, up to the animations' own width (both are 900px), and never wider than the screen. */
    figure.demo { margin: 16px 0 8px; width: min(900px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
    figure.demo img { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; }
    figure.demo figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .bar-button { font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
    .bar-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>This viewer needs JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
